name: Version Packages

# Opens / updates the "chore: version packages" PR whenever changesets are
# present on main. Merging that PR bumps the version in package.json and
# generates the changelog. It does NOT publish — publishing happens in
# publish.yml, which runs when a v* tag is pushed or a GitHub release is
# created (see .github/workflows/publish.yml for the release procedure).

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: version-${{ github.workflow }}-${{ github.ref }}

jobs:
  version:
    name: Version packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Create / update version PR
        uses: changesets/action@v1
        with:
          version: bun run version-packages
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
